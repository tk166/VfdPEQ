<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <defs>
    <!-- 方形像素块 -->
    <rect id="sb-pixel" width="1.8" height="1.8" rx="0.3" fill="#FFFFFF" />
  </defs>

  <!-- 虚线边框无填充正方形 -->
  <rect x="2" y="2" width="18" height="18" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2, 1.6" />

  <!-- 5x3 点阵 'V' (居中放置于 7.7, 5.3) -->
  <g transform="translate(7.7, 5.3)">
    <!-- 行0: x 0 x -->
    <use href="#sb-pixel" x="0" y="0" />
    <use href="#sb-pixel" x="4.8" y="0" />
    <!-- 行1: x 0 x -->
    <use href="#sb-pixel" x="0" y="2.4" />
    <use href="#sb-pixel" x="4.8" y="2.4" />
    <!-- 行2: x 0 x -->
    <use href="#sb-pixel" x="0" y="4.8" />
    <use href="#sb-pixel" x="4.8" y="4.8" />
    <!-- 行3: x 0 x -->
    <use href="#sb-pixel" x="0" y="7.2" />
    <use href="#sb-pixel" x="4.8" y="7.2" />
    <!-- 行4: 0 x 0 -->
    <use href="#sb-pixel" x="2.4" y="9.6" />
  </g>
</svg>
